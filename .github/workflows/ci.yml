name: ci

# Runs the Python tests (including the two-build idempotency test) on every push and pull request.
# Data commits made by daily.yml don't trigger this: GitHub doesn't start workflows from pushes made
# with the workflow's own token. daily.yml runs the dbt tests itself.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install Python and dependencies (exact versions from uv.lock)
        run: uv sync --locked

      - name: Tests
        run: uv run pytest -v
