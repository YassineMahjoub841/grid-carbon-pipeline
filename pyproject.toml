[project]
name = "grid-carbon-pipeline"
version = "0.1.0"
description = "Batch pipeline over RTE eCO2mix: when is French electricity cleanest?"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "duckdb>=1.1",
    "dbt-core>=1.12.7",
    "dbt-duckdb>=1.11.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
